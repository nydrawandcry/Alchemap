# Alchemap: общая тёмная тема. Файл загружается из JAR.
@background = #262030
@foreground = #EEE9F4
@accentColor = #996DD2
@selectionBackground = #55406F
@selectionForeground = #FFFFFF
@disabledForeground = #91869F
@componentBackground = #30273C
@buttonBackground = #382E46

defaultFont = 14
Component.arc = 12
Component.focusWidth = 1
Component.innerFocusWidth = 0
Component.borderColor = #51435F
Component.focusedBorderColor = #B28BEB
Component.focusColor = #B28BEB

Label.disabledForeground = @disabledForeground
Button.arc = 12
Button.margin = 6,12,6,12
Button.background = @buttonBackground
Button.foreground = @foreground
Button.borderColor = #51435F
Button.hoverBackground = #453653
Button.pressedBackground = #4D3A60
Button.focusedBackground = @buttonBackground
Button.disabledBackground = #302938
Button.disabledText = @disabledForeground
[style]Button.primary = background: #7D4DB3; foreground: #FFFFFF; borderColor: #7D4DB3; hoverBackground: #8B59C3; hoverBorderColor: #8B59C3; pressedBackground: #6E40A2; pressedBorderColor: #6E40A2; focusedBackground: #7D4DB3; focusedBorderColor: #C6A1F4; disabledBackground: #3C3248; disabledBorderColor: #3C3248; disabledText: #91869F

TextComponent.arc = 12
TextField.margin = 6,10,6,10
FormattedTextField.margin = 6,10,6,10
TextArea.margin = 8,10,8,10
TextArea.background = @componentBackground
TextArea.foreground = @foreground
TextField.caretForeground = @foreground
TextArea.caretForeground = @foreground
ComboBox.padding = 5,8,5,8
Spinner.padding = 5,8,5,8

ScrollPane.arc = 12
ScrollPane.background = @componentBackground
Viewport.background = @componentBackground
ScrollBar.width = 10
ScrollBar.thumbArc = 999
ScrollBar.thumbInsets = 2,2,2,2
ScrollBar.track = @componentBackground
ScrollBar.thumb = #665373
ScrollBar.hoverThumbColor = #816495

List.background = @componentBackground
List.foreground = @foreground
List.selectionBackground = @selectionBackground
List.selectionForeground = @selectionForeground
List.selectionInactiveBackground = #493758
List.selectionInactiveForeground = @foreground
List.selectionArc = 10
List.selectionInsets = 2,4,2,4

Table.background = @componentBackground
Table.foreground = @foreground
Table.selectionBackground = @selectionBackground
Table.selectionForeground = @selectionForeground
Table.rowHeight = 34
Table.showHorizontalLines = false
Table.showVerticalLines = false
Table.cellMargins = 6,10,6,10
TableHeader.background = #262030
TableHeader.foreground = #BEB4CC
TableHeader.height = 38
TableHeader.cellMargins = 8,10,8,10

TabbedPane.background = #191620
TabbedPane.foreground = #BEB4CC
TabbedPane.selectedBackground = #382C49
TabbedPane.selectedForeground = @foreground
TabbedPane.hoverColor = #30273C
TabbedPane.focusColor = #403052
TabbedPane.underlineColor = #B28BEB
TabbedPane.inactiveUnderlineColor = #996DD2
TabbedPane.tabHeight = 44
TabbedPane.tabInsets = 8,18,8,18
TabbedPane.tabArc = 14
TabbedPane.tabSelectionArc = 4
TabbedPane.tabSelectionHeight = 3
TabbedPane.contentSeparatorHeight = 0
TabbedPane.hasFullBorder = false
TabbedPane.tabsOpaque = false
TabbedPane.tabAreaInsets = 0,0,14,0

SplitPane.background = @background
SplitPaneDivider.gripColor = #665373
ToolTip.background = #382E46
ToolTip.foreground = @foreground
ToolTip.borderColor = #665373
PopupMenu.background = @background
OptionPane.background = @background
